name: Windows Native RDP (Playit.gg)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Administrator Password
        run: |
          net user runneradmin P@ssw0rd123!
          echo "تم تعيين كلمة المرور بنجاح."

      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "تم تفعيل سطح المكتب البعيد بنجاح."

      - name: Download and Start Playit.gg
        run: |
          Write-Host "=================================================="
          Write-Host " جاري تحميل وتشغيل Playit.gg لنظام ويندوز..."
          Write-Host "=================================================="
          
          # تحميل أداة playit
          $playitUrl = "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe"
          Invoke-WebRequest -Uri $playitUrl -OutFile "playit.exe"
          
          # تشغيل الأداة لتوليد رابط المطالبة في السجلات
          Start-Process -FilePath ".\playit.exe" -NoNewWindow
          
          Write-Host "=================================================="
          Write-Host " انتظر 15 ثانية حتى يظهر رابط الـ Claim URL في السجلات أدناه..."
          Write-Host " افتح الرابط في متصفحك لربطه بحسابك، ثم أنشئ نفق TCP للبورت 3389"
          Write-Host " اسم المستخدم: runneradmin"
          Write-Host " كلمة المرور: P@ssw0rd123!"
          Write-Host "=================================================="
          Start-Sleep
